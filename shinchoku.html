<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-store">
<title>案件 進捗管理</title>
<style>
:root{--bg:#0f1420;--surface:#151c2c;--surface2:#1c2540;--line:#2a3350;--ink:#e8edf7;--ink2:#9fb0cf;--accent:#22a7c2;--accent2:#2bd4b6}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;-webkit-text-size-adjust:100%}
#root{max-width:860px;margin:0 auto;padding:14px 14px calc(30px + env(safe-area-inset-bottom,0px))}
.hd{display:flex;align-items:center;gap:10px;margin:2px 0 12px}
.hd h1{font-size:26px;margin:0;font-weight:800}
.hd .sub{font-size:15px;color:var(--ink2)}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.chip{border:1px solid var(--line);background:var(--surface2);color:var(--ink2);border-radius:999px;padding:9px 16px;font-size:16px;font-weight:700;cursor:pointer}
.chip.on{color:#04202a;border-color:transparent}
.search{width:100%;background:var(--surface2);border:1px solid var(--line);border-radius:10px;color:var(--ink);padding:13px 14px;font-size:18px;margin-bottom:14px}
.row{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:15px 15px;margin-bottom:10px;cursor:pointer}
.row:active{transform:scale(.995)}
.row .main{flex:1;min-width:0}
.row .nm{font-size:19.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .meta{font-size:15px;color:var(--ink2);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{font-size:15px;font-weight:800;color:#fff;border-radius:999px;padding:6px 13px;white-space:nowrap}
.badge{font-size:13.5px;font-weight:800;border-radius:6px;padding:3px 9px;color:#04202a}
.badge.seisou{background:#39d3b4}.badge.naiso{background:#f3b14b}.badge.setsubi{background:#b08bf0}
.tag{font-size:13px;font-weight:800;border-radius:6px;padding:3px 9px;background:#0b1220;border:1px solid var(--line);color:var(--ink2)}
.back{background:none;border:0;color:var(--accent2);font-size:17.5px;font-weight:700;cursor:pointer;padding:7px 0;margin-bottom:8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:17px;margin-bottom:13px}
.card h2{font-size:24px;margin:0 0 4px;font-weight:800}
.card .sub{font-size:15px;color:var(--ink2)}
.label{font-size:15px;color:var(--ink2);margin:14px 0 6px;font-weight:700}
.sel,.finput,textarea{width:100%;background:var(--surface2);border:1px solid var(--line);border-radius:10px;color:var(--ink);padding:13px 14px;font-size:18px;font-family:inherit}
textarea{min-height:72px;resize:vertical}
.amt{font-size:19px;font-weight:800;color:var(--accent2)}
/* 工程ステッパー */
.steps{display:flex;flex-direction:column;gap:0;margin:2px 0 2px}
.step{display:flex;align-items:center;gap:10px;padding:4px 0;position:relative}
.step .dot{flex:0 0 14px;width:14px;height:14px;border-radius:50%;border:2px solid var(--line);background:var(--surface2);z-index:1}
.step.done .dot{background:var(--accent2);border-color:var(--accent2)}
.step.cur .dot{background:#fff;border-color:#fff;box-shadow:0 0 0 3px rgba(43,212,182,.35)}
.step .ln{position:absolute;left:6px;top:18px;width:2px;height:calc(100% - 4px);background:var(--line);z-index:0}
.step:last-child .ln{display:none}
.step.done .ln{background:var(--accent2)}
.step .lab{flex:1;font-size:17px;font-weight:700}
.step .dt{font-size:15px;color:var(--ink2);font-weight:700}
.step.cur .lab{color:#fff}
.work{background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:11px 12px;margin-top:7px}
.work .wt{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:700}
.work .wmeta{font-size:15px;color:var(--ink2);margin-top:5px;line-height:1.55}
.work a{color:var(--accent);font-weight:700;text-decoration:none}
.tl{display:flex;flex-direction:column;gap:8px;margin-top:4px}
.tlrow{background:var(--surface2);border:1px solid var(--line);border-left:4px solid var(--accent2);border-radius:8px;padding:9px 11px}
.tlrow .top{display:flex;gap:8px;align-items:center;font-size:15px;color:var(--ink2);margin-bottom:5px}
.tlrow .d{font-weight:800;color:var(--ink)}
.tlrow .mth{background:#0b1220;border:1px solid var(--line);border-radius:6px;padding:2px 9px;font-weight:700}
.tlrow .b{font-size:17px;line-height:1.55;white-space:pre-wrap}
.addwrap{background:var(--surface2);border:1px dashed var(--line);border-radius:10px;padding:10px;margin-top:8px}
.addrow{display:flex;gap:6px;flex-wrap:wrap}
.addrow .finput,.addrow .sel{flex:1;min-width:120px}
.btn{border:0;border-radius:10px;padding:13px 16px;font-weight:800;font-size:17px;cursor:pointer}
.btn.pri{background:linear-gradient(90deg,var(--accent),var(--accent2));color:#04202a}
.btn.g{background:var(--surface2);color:var(--ink);border:1px solid var(--line)}
.load{color:var(--ink2);text-align:center;padding:30px 0;font-size:15px}
.savehint{font-size:12.5px;color:var(--accent2);margin-top:4px;min-height:15px}
.tog{margin-left:auto;display:flex;gap:4px}
.tb{border:1px solid var(--line);background:var(--surface2);color:var(--ink2);border-radius:8px;padding:9px 13px;font-size:15px;font-weight:700;cursor:pointer}
.tb.on{background:var(--accent2);color:#04202a;border-color:transparent}
.kb{display:flex;gap:10px;overflow-x:auto;padding-bottom:10px}
.kbcol{flex:0 0 230px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px;min-height:90px}
.kbhead{font-size:13.5px;font-weight:800;color:#fff;border-radius:6px;padding:6px 9px;margin-bottom:8px;text-align:center}
.kbcard{background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:7px;cursor:pointer}
.kbnm{font-size:15px;font-weight:700}
.kbmeta{font-size:12.5px;color:var(--ink2);margin-top:3px}
.kblast{font-size:12px;color:var(--accent2);margin-top:3px}
.mailit{background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:8px}
.mailhd{display:flex;gap:10px;align-items:baseline;cursor:pointer}
.maild{font-weight:800;color:var(--accent2);font-size:13.5px;white-space:nowrap}
.mailsub{font-size:15px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.mailfrom{font-size:12.5px;color:var(--ink2);margin-top:3px}
.mailbody{font-size:15px;line-height:1.6;white-space:pre-wrap;margin-top:8px;padding-top:8px;border-top:1px solid var(--line)}
.maillink{display:inline-block;margin-top:8px;color:var(--accent);font-weight:700;text-decoration:none;font-size:13.5px}
.syncbar{display:flex;flex-direction:column;gap:7px;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:12px}
.syncbar .hdln{display:flex;align-items:center;gap:8px;font-size:14.5px;margin-bottom:2px}
.syncbar .hdln .t{font-weight:800;color:var(--ink)}
.syncbar .si{display:flex;align-items:center;gap:9px;font-size:14px}
.syncbar .si .nm{flex:1;color:var(--ink);font-weight:700}
.syncbar .si .st{font-size:12.5px;color:var(--ink2);white-space:nowrap}
.syncdot{width:11px;height:11px;border-radius:50%;display:inline-block;flex:0 0 11px}
.recit{padding:9px 0;border-top:1px solid var(--line);cursor:pointer}
.recit:active{opacity:.7}
.recit .rtop{display:flex;gap:9px;align-items:baseline}
.recd{color:var(--accent2);font-weight:800;font-size:13px;white-space:nowrap;flex:0 0 auto}
.recnm{font-weight:700;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.recsub{color:var(--ink2);font-size:13px;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
</style>
</head>
<body>
<div id="root"><div class="load">読み込み中…</div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const BUILD='1791750001';
(function(){try{var K='shinchoku_cbv';fetch(location.pathname+'?_cb='+Date.now(),{cache:'no-store'}).then(function(r){return r.text();}).then(function(t){var m=t.match(/const BUILD='([^']+)'/);if(m&&m[1]!==BUILD&&sessionStorage.getItem(K)!==m[1]){sessionStorage.setItem(K,m[1]);location.replace(location.pathname+(location.search?location.search+'&':'?')+'v='+m[1]+location.hash);}}).catch(function(){});}catch(e){}})();
const SB_URL='https://vfreehhenmwrbxkhcdvu.supabase.co';
const SB_ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZmcmVlaGhlbm13cmJ4a2hjZHZ1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM5NTE5NTAsImV4cCI6MjA5OTUyNzk1MH0.UQKIOeJmn0Yt6gqUC_TF0uoFiRl4poTJyv_tx6BotS8';
const sb=supabase.createClient(SB_URL,SB_ANON);
const root=document.getElementById('root');
const $=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e;};
// ライフサイクル・ステータス（案件一覧から自動判定）
const STATUSES=[['未着手','#6b7280'],['日程調整','#3b82f6'],['見積提出','#d97706'],['発注済','#0ea5e9'],['完工','#16a34a'],['請求','#7c3aed']];
const SCOLOR={};STATUSES.forEach(s=>SCOLOR[s[0]]=s[1]);
const METHODS=['電話','メール','LINE','訪問','その他'];
// 工程ステッパー定義
const LIFE=[['date_tachiai','立会'],['date_mitsumori','見積提出'],['date_hacchu','発注'],['date_kanko_yotei','完工予定'],['date_kanko','完工']];
const KBN3=[['setsubi','設備'],['naiso','内装'],['seisou','清掃']];
const KBNJ={setsubi:'設備',naiso:'内装',seisou:'清掃'};
function todayStr(){const d=new Date();const p=n=>(n<10?'0':'')+n;return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());}
function dtxt(v){if(!v)return'';const s=String(v).slice(0,10).split('-');return s[0]+'/'+(+s[1])+'/'+(+s[2]);}
function yen(n){if(n==null||n==='')return'';const v=Number(n);if(!isFinite(v)||v===0)return'';return '¥'+v.toLocaleString('ja-JP');}
// 新しい順の基準：立会/見積/発注/完工予定/完工 のうち一番新しい日付
function recency(c){const ds=[c.date_tachiai,c.date_mitsumori,c.date_hacchu,c.date_kanko_yotei,c.date_kanko].filter(Boolean).map(d=>String(d).slice(0,10)).sort();return ds.length?ds[ds.length-1]:'';}
function byNew(a,b){const ra=recency(a),rb=recency(b);if(ra&&rb)return rb.localeCompare(ra);if(ra)return -1;if(rb)return 1;return 0;}

function lsGet(k){try{return localStorage.getItem(k);}catch(e){return null;}}
function lsSet(k,v){try{localStorage.setItem(k,v);}catch(e){}}
let VIEW=lsGet('shinchoku_view')||(window.innerWidth>=820?'kanban':'list');
let ALLCASES=[],CASEWORK={},CASEMAT={},CASEMAIL={},ALLEVENTS=[],FILTER='',QUERY='',LASTSYNC=null,SYNC={};
function hhmm(d){if(!d)return'';const p=n=>(n<10?'0':'')+n;return p(d.getHours())+':'+p(d.getMinutes());}
function relTime(d){if(!d)return'';const m=Math.floor((Date.now()-d.getTime())/60000);if(m<1)return'たった今';if(m<60)return m+'分前';const h=Math.floor(m/60);if(h<24)return h+'時間前';return Math.floor(h/24)+'日前';}
function syncLevel(key,intMin){const last=SYNC[key]?new Date(SYNC[key]):null;if(!last)return{lv:3,last:null};const mins=(Date.now()-last.getTime())/60000;return{lv:mins<intMin*2.5?0:(mins<intMin*8?1:2),last:last};}
function syncRow(label,key,intMin){const s=syncLevel(key,intMin);const col=['#16a34a','#d97706','#dc2626','#6b7280'][s.lv];const word=['正常に稼働中','やや遅延','止まっているかも','データなし'][s.lv];
  const row=$('div','si');const dot=$('span','syncdot');dot.style.background=col;row.appendChild(dot);
  row.appendChild($('span','nm',label));
  const st=$('span','st',word+(s.last?'・'+relTime(s.last):''));st.style.color=s.lv===0?'var(--ink2)':col;row.appendChild(st);return row;}
function renderSyncBar(){const b=$('div','syncbar');
  const defs=[['案件の進捗（案件一覧）','progress',1],['資材発注','materials',10],['メール取込','emails',10]];
  const worst=Math.max.apply(null,defs.map(d=>syncLevel(d[1],d[2]).lv===3?2:syncLevel(d[1],d[2]).lv));
  const sum=[['すべて正常','#16a34a'],['一部やや遅延','#d97706'],['要確認（止まってるかも）','#dc2626']][worst];
  const hd=$('div','hdln');hd.appendChild($('span','t','🔌 自動同期'));const bg=$('span',null,sum[0]);bg.style.cssText='font-weight:800;color:'+sum[1];hd.appendChild(bg);b.appendChild(hd);
  defs.forEach(d=>b.appendChild(syncRow(d[0],d[1],d[2])));
  return b;}
function shopName(u){try{const h=new URL(u).hostname.replace('www.','');if(/amazon/.test(h))return'Amazon';if(/rakuten/.test(h))return'楽天';if(/monotaro/.test(h))return'モノタロウ';if(/yahoo/.test(h))return'Yahoo';if(/askul/.test(h))return'アスクル';return h.split('.')[0];}catch(e){return'';}}
function addrPart(a){if(!a)return'';const m=String(a).match(/(東京都|北海道|大阪府|京都府|..[都道府県])/);return m?String(a).slice(String(a).indexOf(m[0])):String(a);}

async function loadData(){
    const {data:cases,error}=await sb.from('cl_progress').select('*').not('case_no','like','ad-TEST*');
    if(error)throw error;
    const {data:logs}=await sb.from('cl_progress_log').select('case_no,log_date');
    const last={};(logs||[]).forEach(l=>{const d=String(l.log_date).slice(0,10);if(!last[l.case_no]||d>last[l.case_no])last[l.case_no]=d;});
    (cases||[]).forEach(c=>c._last=last[c.case_no]||'');
    // cl_cases（設備/内装/清掃の作業日・鍵・図面）を束ねる
    CASEWORK={};
    try{
      const {data:ccs}=await sb.from('cl_cases').select('case_no,kbn,work_date,work_end,staff,vendor,key_info,address,order_url,work_content,note,done');
      (ccs||[]).forEach(w=>{(CASEWORK[w.case_no]=CASEWORK[w.case_no]||[]).push(w);});
    }catch(e){}
    // cl_materials（資材発注＝仕入れ）を束ねる
    CASEMAT={};
    try{
      const {data:mts}=await sb.from('cl_materials').select('case_no,prop,room,staff,order_url,ordered,order_date,delivered,delivery_date,orderer,order_no,note');
      (mts||[]).forEach(w=>{if(w.case_no)(CASEMAT[w.case_no]=CASEMAT[w.case_no]||[]).push(w);});
    }catch(e){}
    // cl_emails（are8kanri CCから突合）を束ねる＋最近の更新用イベント
    CASEMAIL={};ALLEVENTS=[];
    try{
      const {data:ems}=await sb.from('cl_emails').select('case_no,subject,from_addr,mail_date,body,gmail_url').order('mail_date',{ascending:false});
      (ems||[]).forEach(e=>{if(e.case_no){(CASEMAIL[e.case_no]=CASEMAIL[e.case_no]||[]).push(e);ALLEVENTS.push({case_no:e.case_no,date:e.mail_date,kind:'mail',text:e.subject||'メール'});}});
    }catch(e){}
    // cl_updates（シートの更新＝新規/ステータス変化）
    try{
      const {data:ups}=await sb.from('cl_updates').select('case_no,event_date,kind,detail').order('event_date',{ascending:false}).limit(50);
      (ups||[]).forEach(u=>{if(u.case_no)ALLEVENTS.push({case_no:u.case_no,date:u.event_date,kind:u.kind||'sheet',text:u.detail||''});});
    }catch(e){}
    ALLEVENTS.sort((a,b)=>String(b.date||'').localeCompare(String(a.date||'')));
    ALLCASES=cases||[];
    // シート更新（新規/ステータス変化）をアプリ側で検知→cl_updatesへ（GAS不要）
    try{ const ne=await detectChanges(); if(ne&&ne.length){ ne.forEach(ev=>ALLEVENTS.push({case_no:ev.case_no,date:ev.event_date,kind:ev.kind,text:ev.detail})); ALLEVENTS.sort((a,b)=>String(b.date||'').localeCompare(String(a.date||''))); } }catch(e){}
    // 各同期の最終実行時刻（synced_atの最大）
    SYNC={};
    try{
      const g=async(t)=>{const {data}=await sb.from(t).select('synced_at').not('synced_at','is',null).order('synced_at',{ascending:false}).limit(1);return (data&&data[0])?data[0].synced_at:null;};
      SYNC.progress=await g('cl_progress');SYNC.materials=await g('cl_materials');SYNC.emails=await g('cl_emails');
    }catch(e){}
    LASTSYNC=new Date();
}
let INDETAIL=false, AUTOSET=false;
async function detectChanges(){
  try{
    const {data:snap}=await sb.from('cl_status_snap').select('case_no,status');
    const prev={};(snap||[]).forEach(s=>prev[s.case_no]=s.status);
    const seeded=(snap&&snap.length>0);
    const events=[],changed=[],nowIso=new Date().toISOString();
    ALLCASES.forEach(c=>{const was=prev[c.case_no];if(was===c.status)return;changed.push({case_no:c.case_no,status:c.status,updated_at:nowIso});if(!seeded)return;if(was===undefined)events.push({uid:c.case_no+'|new',case_no:c.case_no,kind:'new',detail:'新規案件',event_date:nowIso});else events.push({uid:c.case_no+'|status|'+c.status,case_no:c.case_no,kind:'status',detail:'→ '+c.status,event_date:nowIso});});
    if(events.length)await sb.from('cl_updates').upsert(events,{onConflict:'uid'});
    if(changed.length)await sb.from('cl_status_snap').upsert(changed,{onConflict:'case_no'});
    return events;
  }catch(e){return [];}
}
async function main(){ try{ await loadData(); renderBoard(); startAutoRefresh(); const hv=decodeURIComponent((location.hash||'').replace(/^#/,'')).trim(); if(hv){ const c=ALLCASES.find(x=>x.case_no===hv); if(c) openCase(c); } }catch(e){ root.innerHTML=''; root.appendChild($('div','load','エラー: '+e.message)); } }
async function refresh(){ if(INDETAIL) return; var ae=document.activeElement; if(ae&&/^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName)) return; try{ await loadData(); if(!INDETAIL) renderBoard(); }catch(e){} }
function startAutoRefresh(){ if(AUTOSET) return; AUTOSET=true; setInterval(refresh,15000); document.addEventListener('visibilitychange',function(){ if(!document.hidden) refresh(); }); window.addEventListener('focus',refresh); }

function statusIdx(s){const i=STATUSES.findIndex(x=>x[0]===s);return i<0?0:i;}

function renderBoard(){
  INDETAIL=false;
  root.innerHTML='';
  const hd=$('div','hd');const t=$('div');t.appendChild($('h1',null,'📋 案件 進捗管理'));t.appendChild($('div','sub',ALLCASES.length+'件'+(LASTSYNC?' ・ 更新 '+hhmm(LASTSYNC):'')));hd.appendChild(t);
  const tog=$('div','tog');
  const rb=$('button','tb','🔄');rb.title='最新に更新';rb.onclick=async()=>{rb.textContent='…';await loadData();renderBoard();};tog.appendChild(rb);
  [['list','≣ リスト'],['kanban','▦ カンバン']].forEach(([v,lab])=>{const b=$('button','tb'+(VIEW===v?' on':''),lab);b.onclick=()=>{VIEW=v;lsSet('shinchoku_view',v);renderBoard();};tog.appendChild(b);});hd.appendChild(tog);
  root.appendChild(hd);
  root.appendChild(renderSyncBar());
  const bar=$('div','bar');
  const mk=(k,label,color)=>{const n=k?ALLCASES.filter(c=>c.status===k).length:ALLCASES.length;const b=$('div','chip',label+' '+n);if(FILTER===k){b.classList.add('on');b.style.background=color;}b.onclick=()=>{FILTER=(FILTER===k?'':k);renderBoard();};bar.appendChild(b);};
  mk('','すべて','var(--accent2)');STATUSES.forEach(s=>mk(s[0],s[0],s[1]));
  root.appendChild(bar);
  const search=$('input','search');search.type='search';search.placeholder='🔍 物件名・担当・業者で検索';search.value=QUERY;search.oninput=()=>{QUERY=search.value.trim();drawBody();};root.appendChild(search);
  const bodyEl=$('div');root.appendChild(bodyEl);
  function filtered(){let ms=ALLCASES.slice();if(FILTER)ms=ms.filter(c=>c.status===FILTER);if(QUERY){const q=QUERY.toLowerCase();ms=ms.filter(c=>[c.prop,c.staff,c.vendor,c.work_item,c.case_no].some(v=>String(v||'').toLowerCase().indexOf(q)>=0));}return ms;}
  function drawRecent(cont){
    if(!ALLEVENTS.length)return;
    const card=$('div','card');card.style.padding='12px 14px';
    card.appendChild($('div','label','📬 最近の更新'));
    ALLEVENTS.slice(0,5).forEach(ev=>{
      const prop=(ALLCASES.find(x=>x.case_no===ev.case_no)||{}).prop||ev.case_no;
      const icon=ev.kind==='mail'?'✉️':(ev.kind==='new'?'🆕':'📝');
      const r=$('div','recit');
      const top=$('div','rtop');top.appendChild($('span','recd',dtxt(ev.date)));top.appendChild($('span','recnm',icon+' '+prop));r.appendChild(top);
      if(ev.text)r.appendChild($('div','recsub',ev.text));
      r.onclick=()=>{const c=ALLCASES.find(x=>x.case_no===ev.case_no);if(c)openCase(c);};
      card.appendChild(r);
    });
    cont.appendChild(card);
  }
  function drawBody(){bodyEl.innerHTML='';if(!FILTER&&!QUERY)drawRecent(bodyEl);const ms=filtered();if(VIEW==='kanban')drawKanban(bodyEl,ms);else drawList(bodyEl,ms);}
  function drawList(cont,ms){
    ms=ms.slice().sort(byNew);
    if(!ms.length){cont.appendChild($('div','load','該当なし'));return;}
    ms.forEach(c=>{const r=$('div','row');const m=$('div','main');
      const nm=$('div','nm',c.prop||c.case_no||'—');m.appendChild(nm);
      const meta2=[c.vendor&&('業者:'+c.vendor),c.staff&&('担当:'+c.staff),yen(c.amount),c._last&&('最終 '+dtxt(c._last))].filter(Boolean).join(' ・ ');
      m.appendChild($('div','meta',meta2||('案件 '+c.case_no)));
      r.appendChild(m);const pill=$('span','pill',c.status);pill.style.background=SCOLOR[c.status]||'#6b7280';r.appendChild(pill);r.onclick=()=>openCase(c);cont.appendChild(r);});
  }
  function drawKanban(cont,ms){
    const kb=$('div','kb');
    STATUSES.forEach(s=>{
      const col=$('div','kbcol');const items=ms.filter(c=>c.status===s[0]).sort(byNew);
      const head=$('div','kbhead',s[0]+' ・'+items.length);head.style.background=s[1];col.appendChild(head);
      items.forEach(c=>{const card=$('div','kbcard');card.appendChild($('div','kbnm',c.prop||c.case_no));card.appendChild($('div','kbmeta',[c.staff,yen(c.amount)].filter(Boolean).join(' ・ ')));if(c._last)card.appendChild($('div','kblast','最終 '+dtxt(c._last)));card.onclick=()=>openCase(c);col.appendChild(card);});
      kb.appendChild(col);
    });
    cont.appendChild(kb);
  }
  drawBody();
}

async function openCase(c){
  INDETAIL=true;
  root.innerHTML='';
  try{history.replaceState(null,'','#'+encodeURIComponent(c.case_no));}catch(e){}
  const bar2=$('div');bar2.style.cssText='display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px';
  const back=$('button','back','‹ 一覧へ');back.onclick=()=>{try{history.replaceState(null,'',location.pathname+location.search);}catch(e){}main();};
  const share=$('button','tb','🔗 共有');
  share.onclick=async()=>{
    const url=location.origin+location.pathname+(location.search||'')+'#'+encodeURIComponent(c.case_no);
    const title=(c.prop||c.case_no)+' 進捗';
    try{ if(navigator.share){ await navigator.share({title,url}); return; } }catch(e){ if(e&&e.name==='AbortError')return; }
    try{ await navigator.clipboard.writeText(url); share.textContent='✓ コピーしました'; setTimeout(()=>share.textContent='🔗 共有',1600); }
    catch(_){ prompt('このURLをコピーして共有:',url); }
  };
  bar2.appendChild(back);bar2.appendChild(share);root.appendChild(bar2);
  const card=$('div','card');
  card.appendChild($('h2',null,c.prop||c.case_no));
  const subbits=['案件 '+(c.case_no||''),c.vendor&&('管理 '+c.vendor),c.staff&&('担当 '+c.staff),c.work_item&&('作業 '+c.work_item)].filter(Boolean);
  card.appendChild($('div','sub',subbits.join(' ・ ')));
  // ステータス（自動）＋金額
  const stwrap=$('div');stwrap.style.cssText='display:flex;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap';
  const pill=$('span','pill',c.status);pill.style.background=SCOLOR[c.status]||'#6b7280';stwrap.appendChild(pill);
  if(yen(c.amount)){const a=$('span','amt',yen(c.amount));a.style.marginLeft='auto';stwrap.appendChild(a);}
  card.appendChild(stwrap);
  // 住所（cl_casesから・地図リンク付き）
  const addr=(CASEWORK[c.case_no]||[]).map(w=>w.address).find(Boolean);
  if(addr){const ap=addrPart(addr);const row=$('div');row.style.cssText='margin-top:9px;font-size:16.5px;line-height:1.5';
    row.appendChild($('span',null,'📍 '));row.appendChild(document.createTextNode(ap));
    const a=document.createElement('a');a.href='https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(ap);a.target='_blank';a.rel='noopener';a.textContent=' 地図↗';a.style.cssText='color:var(--accent);font-weight:700;margin-left:6px;text-decoration:none';row.appendChild(a);
    card.appendChild(row);}
  // 見積書・完了写真（Driveフォルダ）
  if(c.quote_url||c.photos_url||c.folder_url){
    const drow=$('div');drow.style.cssText='display:flex;gap:10px;flex-wrap:wrap;margin-top:10px';
    const mk=(href,txt)=>{const a=document.createElement('a');a.href=href;a.target='_blank';a.rel='noopener';a.textContent=txt;a.style.cssText='background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:10px 16px;color:var(--accent);font-weight:800;text-decoration:none;font-size:16.5px';drow.appendChild(a);};
    if(c.quote_url)mk(c.quote_url,'📄 見積書');
    if(c.photos_url)mk(c.photos_url,'📷 完了写真');
    if(c.folder_url)mk(c.folder_url,'📁 物件フォルダ');
    card.appendChild(drow);
  }
  // 工程ステッパー
  card.appendChild($('div','label','工程'));
  const steps=$('div','steps');
  const curIdx=statusIdx(c.status);
  LIFE.forEach(([k,lab],i)=>{
    const st=$('div','step');const done=!!c[k];
    if(done)st.classList.add('done');
    if(lab===c.status||(c.status==='日程調整'&&lab==='立会'))st.classList.add('cur');
    const dot=$('div','dot');const ln=$('div','ln');st.appendChild(dot);st.appendChild(ln);
    st.appendChild($('div','lab',lab));
    st.appendChild($('div','dt',c[k]?dtxt(c[k]):'—'));
    steps.appendChild(st);
  });
  // 請求ステップ
  {const st=$('div','step');if(c.seikyu_flag){st.classList.add('done');}if(c.status==='請求')st.classList.add('cur');
   st.appendChild($('div','dot'));st.appendChild($('div','ln'));st.appendChild($('div','lab','請求'));st.appendChild($('div','dt',c.seikyu_flag?'予定':'—'));steps.appendChild(st);}
  card.appendChild(steps);
  // 設備/内装/清掃の作業予定（cl_cases）
  const works=(CASEWORK[c.case_no]||[]).slice().sort((a,b)=>String(a.work_date||'').localeCompare(String(b.work_date||'')));
  if(works.length){
    card.appendChild($('div','label','設備・内装・清掃の作業予定'));
    works.forEach(w=>{
      const wk=$('div','work');const wt=$('div','wt');
      wt.appendChild($('span','badge '+(w.kbn||''),KBNJ[w.kbn]||w.kbn||'—'));
      let dline=w.work_date?dtxt(w.work_date):'';if(w.work_end&&String(w.work_end).slice(0,10)!==String(w.work_date).slice(0,10))dline+='〜'+dtxt(w.work_end);
      wt.appendChild($('span',null,dline||'日程未定'));if(w.done)wt.appendChild($('span','tag','完了'));
      wk.appendChild(wt);
      const mbits=[w.vendor&&('業者 '+w.vendor),w.staff&&('担当 '+w.staff),w.key_info&&('鍵 '+w.key_info)].filter(Boolean);
      if(mbits.length)wk.appendChild($('div','wmeta',mbits.join(' ・ ')));
      if(w.order_url){const a=document.createElement('a');a.href=w.order_url;a.target='_blank';a.rel='noopener';a.textContent='発注書を開く ↗';const wm=$('div','wmeta');wm.appendChild(a);wk.appendChild(wm);}
      card.appendChild(wk);
    });
  }
  // 資材発注（仕入れ）cl_materials
  const mats=(CASEMAT[c.case_no]||[]).slice().sort((a,b)=>String(a.order_date||'').localeCompare(String(b.order_date||'')));
  if(mats.length){
    card.appendChild($('div','label','資材発注（仕入れ）'+mats.length+'件'));
    mats.forEach(w=>{
      const wk=$('div','work');const wt=$('div','wt');
      if(w.order_url){const a=document.createElement('a');a.href=w.order_url;a.target='_blank';a.rel='noopener';a.textContent=(shopName(w.order_url)||'発注先')+' ↗';wt.appendChild(a);}
      else wt.appendChild($('span',null,w.note||'資材'));
      if(w.delivered)wt.appendChild($('span','tag','✓納品'));
      else if(w.ordered)wt.appendChild($('span','tag','発注済'));
      wk.appendChild(wt);
      const bits=[w.order_date&&('発注 '+w.order_date),w.delivery_date&&('納品 '+w.delivery_date),w.orderer&&('発注者 '+w.orderer),w.order_no&&('No '+w.order_no),w.note].filter(Boolean);
      if(bits.length)wk.appendChild($('div','wmeta',bits.join(' ・ ')));
      card.appendChild(wk);
    });
  }
  // 手入力項目（アプリ内・編集可／案件一覧同期で上書きされない）
  card.appendChild($('div','label','手入力'));
  const man=$('div');man.style.cssText='display:flex;flex-direction:column;gap:8px';
  const mh=$('div','savehint','');
  async function saveField(key,val){const nv=val||null;if((c[key]||null)===nv)return;const o={updated_at:new Date().toISOString()};o[key]=nv;c[key]=nv;const {error}=await sb.from('cl_progress').update(o).eq('id',c.id);mh.textContent=error?('保存失敗: '+error.message):'✓ 保存しました';setTimeout(()=>{mh.textContent='';},1400);}
  // 立会確認者（1件）
  {const row=$('div');row.style.cssText='display:flex;align-items:center;gap:8px';
   const l=$('div',null,'完了確認担当者');l.style.cssText='flex:0 0 auto;white-space:nowrap;font-size:16px;color:var(--ink2);font-weight:800';
   const inp=$('input','finput');inp.type='text';inp.style.cssText='flex:1;margin:0';inp.placeholder='（未入力）';if(c.tachiai_checker)inp.value=c.tachiai_checker;inp.onblur=()=>saveField('tachiai_checker',inp.value);
   row.appendChild(l);row.appendChild(inp);man.appendChild(row);}
  // 各工事：日程＋施工者（種別ごとに別）
  [['setsubi','設備','#b08bf0'],['naiso','内装','#f3b14b'],['seisou','清掃','#39d3b4']].forEach(([k,lab,col])=>{
    const row=$('div');row.style.cssText='display:flex;align-items:center;gap:6px;flex-wrap:wrap';
    const l=$('span','badge '+k,lab);l.style.cssText='flex:0 0 auto;align-self:center';
    const dk='date_'+k, wk='worker_'+k;
    const di=$('input','finput');di.type='date';di.style.cssText='flex:1 1 128px;margin:0';if(c[dk])di.value=String(c[dk]).slice(0,10);di.onchange=()=>saveField(dk,di.value);
    const wi=$('input','finput');wi.type='text';wi.placeholder=lab+'の施工者';wi.style.cssText='flex:1 1 128px;margin:0';if(c[wk])wi.value=c[wk];wi.onblur=()=>saveField(wk,wi.value);
    row.appendChild(l);row.appendChild(di);row.appendChild(wi);man.appendChild(row);
  });
  man.appendChild(mh);card.appendChild(man);
  // 備考（案件一覧・参考）
  if(c.note_master){card.appendChild($('div','label','備考'));const nm=$('div');nm.style.cssText='font-size:16.5px;line-height:1.6;white-space:pre-wrap;color:var(--ink)';nm.textContent=c.note_master;card.appendChild(nm);}
  // メモ（アプリ内・編集可）
  card.appendChild($('div','label','メモ'));
  const memo=$('textarea');memo.value=c.memo||'';memo.placeholder='自由記入（例：鍵は管理会社／追加見積待ち 等）';
  const sh2=$('div','savehint','');
  memo.onblur=async()=>{if((c.memo||'')===memo.value)return;const {error}=await sb.from('cl_progress').update({memo:memo.value,updated_at:new Date().toISOString()}).eq('id',c.id);sh2.textContent=error?'保存失敗':'✓ 保存しました';c.memo=memo.value;setTimeout(()=>sh2.textContent='',1500);};
  card.appendChild(memo);card.appendChild(sh2);
  root.appendChild(card);
  // メール（are8kanri CCから突合・クリックで本文展開）
  const mails=(CASEMAIL[c.case_no]||[]).slice().sort((a,b)=>String(b.mail_date||'').localeCompare(String(a.mail_date||'')));
  if(mails.length){
    const mcard=$('div','card');
    mcard.appendChild($('h2',null,'✉️ メール '+mails.length+'件'));
    mails.forEach(m=>{
      const it=$('div','mailit');
      const hd=$('div','mailhd');
      hd.appendChild($('span','maild',dtxt(m.mail_date)));
      hd.appendChild($('span','mailsub',(m.subject||'(件名なし)')));
      const bd=$('div','mailbody');bd.textContent=m.body||'';bd.style.display='none';
      hd.onclick=()=>{bd.style.display=(bd.style.display==='none'?'block':'none');};
      it.appendChild(hd);
      if(m.from_addr)it.appendChild($('div','mailfrom',m.from_addr));
      it.appendChild(bd);
      if(m.gmail_url){const a=document.createElement('a');a.href=m.gmail_url;a.target='_blank';a.rel='noopener';a.textContent='Gmailで開く ↗';a.className='maillink';it.appendChild(a);}
      mcard.appendChild(it);
    });
    root.appendChild(mcard);
  }
  // やり取り履歴
  const lcard=$('div','card');
  lcard.appendChild($('h2',null,'やり取り履歴'));
  const tl=$('div','tl');lcard.appendChild(tl);
  const add=$('div','addwrap');
  add.appendChild($('div','label','やり取りを追加'));
  const row1=$('div','addrow');
  const di=$('input','finput');di.type='date';di.value=todayStr();di.style.flex='0 0 140px';
  const dnow=$('button','chip','今日');const dyst=$('button','chip','昨日');
  dnow.onclick=()=>{di.value=todayStr();};
  dyst.onclick=()=>{const d=new Date();d.setDate(d.getDate()-1);di.value=d.toISOString().slice(0,10);};
  const msel=$('select','sel');METHODS.forEach(m=>{const o=$('option',null,m);o.value=m;msel.appendChild(o);});msel.style.flex='0 0 110px';
  const au=$('input','finput');au.placeholder='記入者';au.style.flex='1 1 100px';
  row1.appendChild(di);row1.appendChild(dnow);row1.appendChild(dyst);row1.appendChild(msel);row1.appendChild(au);add.appendChild(row1);
  const body=$('textarea');body.placeholder='内容（例：着工日を10/15で確定 ／ 追加見積を送付）';body.style.marginTop='6px';add.appendChild(body);
  const addbtn=$('button','btn pri','＋ 記録する');addbtn.style.marginTop='8px';add.appendChild(addbtn);
  lcard.appendChild(add);
  root.appendChild(lcard);

  let logs=[];
  async function loadLogs(){const {data}=await sb.from('cl_progress_log').select('*').eq('case_no',c.case_no).order('log_date',{ascending:false}).order('created_at',{ascending:false});logs=data||[];drawLogs();}
  function drawLogs(){tl.innerHTML='';if(!logs.length){tl.appendChild($('div','load','まだやり取りがありません'));return;}logs.forEach(l=>{const r=$('div','tlrow');r.style.borderLeftColor=SCOLOR[c.status]||'#2bd4b6';const top=$('div','top');top.appendChild($('span','d',dtxt(l.log_date)));if(l.method)top.appendChild($('span','mth',l.method));if(l.author)top.appendChild($('span',null,l.author));r.appendChild(top);r.appendChild($('div','b',l.body||''));tl.appendChild(r);});}
  addbtn.onclick=async()=>{
    const v=body.value.trim();if(!v){alert('内容を入れてください');return;}
    addbtn.disabled=true;addbtn.textContent='記録中…';
    const rec={case_no:c.case_no,log_date:di.value||todayStr(),method:msel.value,body:v,author:au.value.trim()||null};
    const {data,error}=await sb.from('cl_progress_log').insert(rec).select();
    if(error){addbtn.disabled=false;addbtn.textContent='＋ 記録する';alert('失敗: '+error.message);return;}
    logs.unshift(data[0]);drawLogs();body.value='';addbtn.disabled=false;addbtn.textContent='＋ 記録する';
    sb.from('cl_progress').update({updated_at:new Date().toISOString()}).eq('id',c.id);
  };
  loadLogs();
}
main();
</script>
</body>
</html>

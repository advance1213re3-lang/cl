<style>
:root{--bg:#eef1f5;--surface:#fff;--surface-2:#f3f6f9;--ink:#16202b;--ink-2:#5b6775;--line:#dce2ea;--accent:#0e7490;--accent-ink:#fff;--naiso:#b45309;--seisou:#0e7490;--setsubi:#7c3aed;--none:#8794a3;--prog:#2f6fb0;--done:#2f9e5b;--sh:0 1px 2px rgba(16,32,48,.06),0 8px 24px rgba(16,32,48,.07);--r:14px}

.wrap{max-width:960px;margin:0 auto;padding:20px 16px 48px}.app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
.eyebrow{font-size:12px;letter-spacing:.08em;color:var(--accent);font-weight:700;text-transform:uppercase}h1{margin:2px 0 8px;font-size:22px;font-weight:800;line-height:1.25}h1 .room{color:var(--ink-2)}.sub{color:var(--ink-2);font-size:13px}
.hd2{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line);padding:12px 16px;box-shadow:var(--sh)}.back{display:inline-block;margin-bottom:8px;color:var(--accent);text-decoration:none;font-weight:700;font-size:14px}
.pstat{margin:12px 12px 0;padding:11px 14px;border-radius:11px;font-weight:800;font-size:15px;text-align:center}.pstat.done{color:var(--done);background:color-mix(in srgb,var(--done) 16%,transparent);border:1px solid color-mix(in srgb,var(--done) 40%,var(--line))}.pstat.prog{color:var(--prog);background:color-mix(in srgb,var(--prog) 14%,transparent);border:1px solid color-mix(in srgb,var(--prog) 35%,var(--line))}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.chip{font-size:12px;font-weight:600;color:var(--ink-2);background:var(--surface-2);border:1px solid var(--line);padding:3px 9px;border-radius:999px}
.badge{font-size:11px;font-weight:800;padding:3px 9px;border-radius:6px;color:#fff}.badge.naiso{background:var(--naiso)}.badge.seisou{background:var(--seisou)}.badge.setsubi{background:var(--setsubi)}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:16px 0}.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;box-shadow:var(--sh)}.tile .n{font-size:26px;font-weight:800;line-height:1}.tile .l{font-size:12px;color:var(--ink-2);margin-top:4px;font-weight:600}.tile.done .n{color:var(--done)}.tile.prog .n{color:var(--prog)}.tile.none .n{color:var(--none)}
.filters{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}.fb{font:inherit;font-weight:700;font-size:13px;padding:7px 14px;border-radius:999px;cursor:pointer;color:var(--ink-2);background:var(--surface);border:1px solid var(--line)}.fb[aria-pressed=true]{color:var(--accent-ink);background:var(--accent);border-color:transparent}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--sh);display:flex;flex-direction:column;gap:9px}.card .top{display:flex;justify-content:space-between;align-items:center}.card .name{font-size:17px;font-weight:800}.card .name .room{color:var(--ink-2)}.card .meta{display:flex;flex-direction:column;gap:3px;font-size:13px}.card .mline{display:flex;gap:10px}.card .mk{color:var(--ink-2);min-width:46px}.card .mv{font-weight:600}.card .mline.due-over .mv{color:#c9772e;font-weight:800}.card .mline.due-soon .mv{color:#e0a02b}.card .mline.due-over .mv::after{content:"　超過";font-size:11px}.card .mline.due-soon .mv::after{content:"　間近";font-size:11px}
.pill{font-size:14px;font-weight:800;padding:6px 14px;border-radius:999px;display:inline-flex;align-items:center}.pill::before{content:"";width:10px;height:10px;border-radius:50%;background:currentColor;margin-right:8px}.pill.none{color:var(--none);background:color-mix(in srgb,var(--none) 16%,transparent)}.pill.prog{color:var(--prog);background:color-mix(in srgb,var(--prog) 16%,transparent)}.pill.done{color:var(--done);background:color-mix(in srgb,var(--done) 20%,transparent)}
.card.st-none{border-left:6px solid var(--none)}.card.st-prog{border-left:6px solid var(--prog)}.card.st-done{border-left:6px solid var(--done)}
.pbar{display:flex;align-items:center;gap:10px}.bar{flex:1;height:8px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden}.bar>span{display:block;height:100%;background:var(--done)}.frac{font-size:13px;font-weight:700;color:var(--ink-2)}

.oprow{display:flex;align-items:center;gap:8px;padding:10px 16px 0;font-size:13px;color:var(--ink-2)}.oprow select{font:inherit;font-weight:700;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:8px;min-height:40px}
main{flex:1;padding:12px}ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}.item{display:flex;align-items:flex-start;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;min-height:58px;cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent}.item:active{background:var(--surface-2)}.item.done{background:color-mix(in srgb,var(--done) 9%,var(--surface));border-color:color-mix(in srgb,var(--done) 40%,var(--line))}
.box{flex:none;width:27px;height:27px;border-radius:7px;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;margin-top:1px}.item.done .box{background:var(--done);border-color:var(--done)}.box svg{width:16px;height:16px;stroke:#fff;stroke-width:3.4;fill:none;opacity:0}.item.done .box svg{opacity:1}.body{flex:1}.label{font-size:16px;font-weight:600}.item.done .label{color:var(--ink-2);text-decoration:line-through}.meta{font-size:12px;color:var(--ink-2);margin-top:4px;display:none}.item.done .meta{display:block}

/* photos page */
.upwrap{padding:16px 12px}
.upbig{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;font:inherit;font-weight:800;font-size:18px;padding:20px;border:none;border-radius:14px;background:var(--accent);color:var(--accent-ink);cursor:pointer;box-shadow:var(--sh)}
.upbig:disabled{opacity:.6}
.prog2{margin-top:16px;display:none}.prog2.on{display:block}.prog2 .pbar2{height:14px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden}.prog2 .pbar2>span{display:block;height:100%;background:var(--done);width:0;transition:width .2s}.prog2 .ptxt{font-size:14px;font-weight:800;color:var(--ink);margin-top:8px;text-align:center}.prog2 .psub{font-size:12px;color:var(--ink-2);text-align:center;margin-top:2px}

.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:0 12px}.photos a{position:relative;display:block;aspect-ratio:1;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:var(--surface-2)}.photos img{width:100%;height:100%;object-fit:cover}
.ov{position:fixed;inset:0;background:rgba(10,18,28,.55);display:none;align-items:flex-end;justify-content:center;z-index:20}.ov.open{display:flex}@media(min-width:600px){.ov{align-items:center;padding:20px}}
.msheet{background:var(--surface);width:100%;max-width:480px;max-height:80vh;display:flex;flex-direction:column;border-radius:18px 18px 0 0;box-shadow:var(--sh)}@media(min-width:600px){.msheet{border-radius:18px}}
.mhd{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}.mhd b{font-size:16px}.mhd .x{border:none;background:var(--surface-2);color:var(--ink);width:32px;height:32px;border-radius:9px;font-size:19px;cursor:pointer}
.thread{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:10px;min-height:140px;font-size:13px}.thread.empty{color:var(--ink-2);text-align:center;justify-content:center}.mrow{display:flex}.mrow.own{justify-content:flex-end}.mbub{max-width:82%;background:var(--surface-2);border:1px solid var(--line);border-radius:13px;padding:8px 12px}.mrow.own .mbub{background:color-mix(in srgb,var(--accent) 16%,var(--surface))}.mwho{font-size:11px;font-weight:700;color:var(--accent);margin-bottom:3px}.mtx{font-size:14.5px;white-space:pre-wrap;word-break:break-word}.mact{display:flex;gap:12px;margin-top:6px;justify-content:flex-end}.mact button{border:none;background:transparent;color:var(--ink-2);font-size:12px;font-weight:700;cursor:pointer;text-decoration:underline}
.minput{display:flex;gap:8px;padding:12px 14px;border-top:1px solid var(--line)}.minput input{flex:1;font:inherit;padding:11px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink)}.minput button{flex:none;font:inherit;font-weight:700;padding:0 16px;border:none;border-radius:10px;background:var(--accent);color:var(--accent-ink);cursor:pointer}
footer{padding:16px;text-align:center;color:var(--ink-2);font-size:12px}
.load{padding:40px;text-align:center;color:var(--ink-2)}
/* calendar dashboard */
.calwrap{max-width:1000px;margin:0 auto;padding:0 0 40px}
.calhd{position:sticky;top:0;z-index:6;background:var(--surface);border-bottom:1px solid var(--line);box-shadow:var(--sh);padding:10px 14px}
.calhd .r1{display:flex;align-items:center;gap:8px}
.calbrand{font-size:17px;font-weight:800}
.calmonth{font-size:17px;font-weight:800;margin-left:2px}
.calnav{margin-left:auto;display:flex;gap:6px}
.calnav button{font:inherit;font-weight:700;font-size:14px;min-width:38px;padding:7px 12px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.calfil{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;align-items:center}
.calfil .fb{font:inherit;font-weight:700;font-size:12px;padding:5px 13px;border-radius:999px;cursor:pointer;color:var(--ink-2);background:var(--surface-2);border:1px solid var(--line)}
.calfil .fb[aria-pressed=true]{color:var(--accent-ink);background:var(--accent);border-color:transparent}
.calsearch{flex:1;min-width:150px;font:inherit;font-size:13px;padding:7px 13px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.sres{background:var(--surface);border-bottom:1px solid var(--line);max-height:46vh;overflow:auto}
.sreshd{padding:8px 14px;font-size:12px;font-weight:800;color:var(--ink-2);position:sticky;top:0;background:var(--surface);border-bottom:1px solid var(--line)}
.sreslist{display:flex;flex-direction:column}
.sresrow{display:flex;align-items:center;gap:8px;padding:9px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.sresrow:active{background:var(--surface-2)}
.sresrow .sc{width:10px;height:10px;border-radius:50%;flex:none}
.sresrow .sresdate{font-size:12px;font-weight:700;color:var(--ink-2);min-width:44px;flex:none}
.sresrow .sresnm{font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wkhd{display:grid;grid-template-columns:repeat(7,1fr);background:var(--surface);border-bottom:1px solid var(--line)}
.wkhd>div{padding:7px 0;text-align:center;font-size:12px;font-weight:700;color:var(--ink-2)}
.wkhd .sat{color:#3b82f6}.wkhd .sun{color:#ef4444}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);border-top:1px solid var(--line);border-left:1px solid var(--line)}
.dcell{min-height:98px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:3px;display:flex;flex-direction:column;gap:2px;overflow:hidden;background:var(--surface);cursor:pointer}
.dcell.oth{background:var(--surface-2)}
.dcell .dn{font-size:12px;font-weight:700;align-self:flex-start;min-width:20px;text-align:center;padding:1px 4px;border-radius:999px;line-height:1.5;color:var(--ink)}
.dcell.oth .dn{color:var(--ink-2)}
.dcell.today .dn{background:var(--accent);color:var(--accent-ink)}
.dcell.sun .dn{color:#ef4444}.dcell.sat .dn{color:#3b82f6}
.dcell .ev{font-size:11px;font-weight:700;color:#fff;background:var(--none);border-radius:5px;padding:2px 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.4;cursor:pointer}
.dcell .ev.done{opacity:.5;text-decoration:line-through}
.dcell .more{font-size:10.5px;font-weight:700;color:var(--ink-2);padding:0 3px}
@media(max-width:560px){.dcell{min-height:76px}.dcell .ev{font-size:9.5px;padding:1px 4px}.calbrand{font-size:15px}.calmonth{font-size:15px}}
.dayrow{display:flex;flex-direction:column;gap:6px;padding:12px 14px;border-bottom:1px solid var(--line)}
.dayrow .t{display:flex;align-items:center;gap:8px}
.dayrow .sc{width:11px;height:11px;border-radius:50%;flex:none}
.dayrow .nm{font-weight:800;font-size:15px}
.dayrow .sub{font-size:12px;color:var(--ink-2)}
.dayrow .acts{display:flex;gap:8px}
.dinfo{display:flex;flex-direction:column;gap:3px;font-size:12.5px;background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:8px 10px}
.dinfo .kv{display:flex;gap:8px}
.dinfo .kv .k{color:var(--ink-2);min-width:38px;flex:none;font-weight:700}
.dinfo .kv .v{color:var(--ink);font-weight:600;word-break:break-word;white-space:pre-wrap}
.dinfo .olink{color:var(--accent);font-weight:700;text-decoration:none}
.hdinfo{margin-top:8px;display:flex;flex-direction:column;gap:3px;font-size:13px}
.hdinfo .kv{display:flex;gap:8px}.hdinfo .kv .k{color:var(--ink-2);min-width:38px;flex:none;font-weight:700}.hdinfo .kv .v{font-weight:600;word-break:break-word}

<body>
<div id="root"><div class="load">読み込み中…</div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SB_URL='https://vfreehhenmwrbxkhcdvu.supabase.co';
const SB_ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZmcmVlaGhlbm13cmJ4a2hjZHZ1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM5NTE5NTAsImV4cCI6MjA5OTUyNzk1MH0.UQKIOeJmn0Yt6gqUC_TF0uoFiRl4poTJyv_tx6BotS8';
const BUCKET='cl-photos';
const KBN={naiso:'内装',seisou:'清掃',setsubi:'設備'};
// Googleカレンダーの担当者色（担当者マスタC列＝カレンダー色に対応）
const CAL_COLORS={red:'#D50000',blue:'#3F51B5',green:'#0B8043',yellow:'#F6BF26',orange:'#F4511E',cyan:'#039BE5',purple:'#8E24AA',gray:'#616161',lavender:'#7986CB',sage:'#33B679',flamingo:'#E67C73'};
const STAFF_COLOR={'アイン':'orange','グエン':'green','奈良':'gray','永井':'purple','北冨':'red','今野':'blue','髙橋':'yellow','高橋':'yellow','稲垣':'cyan','鈴村':'green'};
function normName(s){return String(s||'').trim().replace('北富','北冨').replace('あいん','アイン');}
function staffColor(name){const n=normName(String(name||'').split(/[,、\/／＆&]/)[0]);const k=STAFF_COLOR[n];return k?CAL_COLORS[k]:'';}
function kbnColor(kbn){return kbn==='naiso'?'var(--naiso)':kbn==='setsubi'?'var(--setsubi)':'var(--seisou)';}
function ymd(d){const p=n=>(n<10?'0':'')+n;return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());}
// 納期表示：JSのDate文字列(Mon Jul 27 2026 …GMT…)は yyyy/M/d に整形。「即日〜…」等の文章はそのまま。
function fmtDue(v){if(!v)return'';const s=String(v);if(/GMT|\d{2}:\d{2}:\d{2}|\dT\d/.test(s)){const d=new Date(s);if(!isNaN(d))return d.getFullYear()+'/'+(d.getMonth()+1)+'/'+d.getDate();}return s;}
// 検索用の正規化：カタカナ→ひらがな＋小文字化（ひらがな/カタカナどちらで検索してもヒット）
function kana(s){return String(s||'').toLowerCase().replace(/[ァ-ヶ]/g,function(c){return String.fromCharCode(c.charCodeAt(0)-0x60);});}
let STAFF=['北冨','髙橋','鈴村','今野','永井'];
async function loadStaff(){try{const {data}=await sb.from('cl_staff').select('name').order('sort').order('name');if(data&&data.length)STAFF=data.map(r=>r.name);}catch(e){}}
const UP_CONCURRENCY=5;
const sb=supabase.createClient(SB_URL,SB_ANON);
const root=document.getElementById('root');
const $=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e;};
const qp=new URLSearchParams(location.search);
const opKey='cl_op';
function op(){return localStorage.getItem(opKey)||STAFF[0];}
function setOp(v){localStorage.setItem(opKey,v);}
function splitWork(s){s=String(s||'').trim();if(!s)return[];return s.split(/\s*[\/／、,，\n・]\s*/).map(x=>x.trim()).filter(Boolean);}
function dtxt(v){if(!v)return'';const d=new Date(v);if(isNaN(d))return String(v);return (d.getMonth()+1)+'/'+d.getDate();}
function ttxt(v){if(!v)return'';const d=new Date(v);if(isNaN(d))return'';const p=n=>(n<10?'0':'')+n;return (d.getMonth()+1)+'/'+d.getDate()+' '+p(d.getHours())+':'+p(d.getMinutes());}
function dueState(due){if(!due)return'';const m=String(due).match(/(\d{4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})/g);if(!m)return'';const last=m[m.length-1].split(/[\/\-.]/);const d=new Date(+last[0],+last[1]-1,+last[2]);const now=new Date();const t=new Date(now.getFullYear(),now.getMonth(),now.getDate());const diff=Math.round((d-t)/86400000);if(diff<0)return'over';if(diff<=3)return'soon';return'ok';}

async function main(){
  const view=qp.get('view')||'dashboard';
  const c=(qp.get('case')||'').trim();
  const kbn=(qp.get('kbn')||'').trim();
  try{
    if(view==='checklist'&&c) return renderChecklist(c,kbn);
    if(view==='photos'&&c) return renderPhotos(c,kbn);
    return renderDashboard();
  }catch(e){root.innerHTML='';root.appendChild($('div','load','エラー: '+e.message));}
}

async function renderDashboard(){
  const {data:cases,error}=await sb.from('cl_cases').select('*');
  if(error)throw error;
  const {data:checks}=await sb.from('cl_checks').select('case_no,kbn,done');
  const stat={};(checks||[]).forEach(r=>{const k=r.case_no+'|'+(r.kbn||'');const s=stat[k]||(stat[k]={d:0,t:0});s.t++;if(r.done)s.d++;});

    const rawExt=(f.name.split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,'')||'jpg';

      const bmp=await createImageBitmap(f);const MAX=1600;let w=bmp.width,h=bmp.height;

        if(ue)throw ue;
        const {data:pub}=sb.storage.from(BUCKET).getPublicUrl(path);
        const {data:row,error:ie}=await sb.from('cl_photos').insert({case_no:caseNo,kbn:c.kbn,path:path,url:pub.publicUrl,author:who}).select();
        if(ie)throw ie;
        return row[0];
      }catch(e){ if(attempt>=3) throw e; await sleep(500*attempt); }
    }
  }
  async function runUpload(files){
    if(!files||!files.length)return;
    upbtn.disabled=true;rebtn.disabled=true;rebtn.style.display='none';prog.classList.add('on');
    const who=curOp;const total=files.length;const t0=Date.now();
    let done=0,ok=0;const failed=[];let idx=0,lastErr=null;
    const update=()=>{const pct=Math.round(done/total*100);pfill.style.width=pct+'%';ptxt.textContent=done+' / '+total+' 枚';const sec=(Date.now()-t0)/1000;const rate=done?done/sec:0;const eta=rate?Math.max(0,Math.round((total-done)/rate)):0;psub.textContent=(failed.length?'失敗 '+failed.length+' 件 / ':'')+'残り約 '+eta+' 秒';};
    update();
    async function worker(){while(idx<files.length){const my=idx++;try{const rec=await uploadOne(files[my],who);photos.unshift(rec);ok++;drawGallery();}catch(e){failed.push(files[my]);lastErr=e;console.error('upload失敗',e);}done++;update();}}
    await Promise.all(Array.from({length:Math.min(UP_CONCURRENCY,files.length)},worker));
    lastFailed=failed;upbtn.disabled=false;rebtn.disabled=false;
    ptxt.textContent='完了：'+ok+' 枚アップ'+(failed.length?'（失敗 '+failed.length+'）':'');psub.textContent=(failed.length&&lastErr)?('原因: '+String(lastErr.message||lastErr.error||lastErr.msg||lastErr).slice(0,160)):'';
    if(failed.length){rebtn.textContent='⟳ 失敗した '+failed.length+' 枚を再アップロード';rebtn.style.display='flex';}
    else{setTimeout(()=>prog.classList.remove('on'),4000);}
  }
  upbtn.onclick=()=>fileInput.click();
  fileInput.onchange=()=>{const files=[...fileInput.files];fileInput.value='';runUpload(files);};
  rebtn.onclick=()=>{const f=lastFailed;lastFailed=[];runUpload(f);};
}
// 戻る操作でbfcacheから復元された時は最新の完了状態を反映するため再読込
window.addEventListener('pageshow',function(e){if(e.persisted)location.reload();});
loadStaff().then(main);

<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-store">
<title>現調・立会 写真</title>
<style>
:root{--bg:#0f1420;--surface:#151c2c;--surface2:#1c2540;--line:#2a3350;--ink:#e8edf7;--ink2:#9fb0cf;--accent:#22a7c2;--accent2:#2bd4b6;--danger:#c0392b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;-webkit-text-size-adjust:100%}
#root{max-width:720px;margin:0 auto;padding:14px 14px calc(28px + env(safe-area-inset-bottom,0px))}
.hd{display:flex;align-items:center;gap:10px;margin:4px 0 14px}
.hd h1{font-size:19px;margin:0;font-weight:800}
.hd .sub{font-size:12px;color:var(--ink2)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.search{width:100%;background:var(--surface2);border:1px solid var(--line);border-radius:10px;color:var(--ink);padding:11px 12px;font-size:15px;margin-bottom:12px}
.blist{display:flex;flex-direction:column;gap:8px}
.brow{background:var(--surface2);border:1px solid var(--line);border-radius:11px;padding:12px 13px;cursor:pointer}
.brow:active{transform:scale(.99)}
.brow .nm{font-size:15px;font-weight:700}
.brow .meta{font-size:12px;color:var(--ink2);margin-top:3px}
.newb{border:1px dashed var(--accent);color:var(--accent2);border-radius:11px;padding:12px 13px;text-align:center;font-weight:700;cursor:pointer;background:transparent}
.finput{width:100%;background:var(--surface2);border:1px solid var(--line);border-radius:10px;color:var(--ink);padding:11px 12px;font-size:15px;margin:6px 0 10px}
.label{font-size:12px;color:var(--ink2);margin:6px 0 2px;font-weight:700}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:13px;font-size:16px;font-weight:800;cursor:pointer}
.btn.up{background:linear-gradient(90deg,var(--accent),var(--accent2));color:#04202a}
.btn.ghost{background:var(--surface2);color:var(--ink);border:1px solid var(--line)}
.back{background:none;border:0;color:var(--accent2);font-size:14px;font-weight:700;cursor:pointer;padding:4px 0;margin-bottom:8px}
.hint{font-size:11px;color:var(--ink2);text-align:center;margin:6px 0 0}
.grp{font-size:12px;color:var(--ink2);font-weight:700;margin:14px 0 6px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.grid a{display:block;aspect-ratio:1;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface2)}
.grid img{width:100%;height:100%;object-fit:cover;display:block}
.prog{margin-top:10px;background:var(--surface2);border-radius:10px;padding:10px;display:none}
.prog.on{display:block}
.pbar{height:8px;background:#0b1220;border-radius:6px;overflow:hidden}
.pbar span{display:block;height:100%;width:0;background:var(--accent2);transition:width .2s}
.ptxt{font-size:12px;color:var(--ink2);margin-top:6px}
.load{color:var(--ink2);text-align:center;padding:30px 0}
.gcount{font-size:12px;color:var(--ink2);margin:10px 0 4px}
</style>
</head>

<div id="root"><div class="load">読み込み中…</div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>

const $=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e;};
function todayStr(){const d=new Date();const p=n=>(n<10?'0':'')+n;return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());}
function dtxt(v){if(!v)return'';const s=String(v).slice(0,10).split('-');return (+s[1])+'/'+(+s[2]);}
function slug(s){return String(s||'').trim().replace(/[\\\/:*?"<>|#]+/g,'_').replace(/\s+/g,' ').slice(0,80)||'b';}
function hhex(s){let h=5381;s=String(s||'');for(let i=0;i<s.length;i++){h=((h*33)^s.charCodeAt(i))>>>0;}return h.toString(16);}
async function loadJSZip(){if(window.JSZip)return;await new Promise((res,rej)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js';s.onload=res;s.onerror=()=>rej(new Error('zip読込失敗'));document.head.appendChild(s);});}
function isVideoFile(f){return /^video\//.test((f&&f.type)||'')|| /\.(mp4|mov|m4v|webm|3gp|avi|hevc)$/i.test((f&&f.name)||'');}
function isVideoName(s){return /\.(mp4|mov|m4v|webm|3gp)(\?|$)/i.test(String(s||''));}
// 動画をブラウザ内で再エンコード（480p/15fps・音声なし）。1分想定・実時間かかる。
async function compressVideo(file,onProgress){
  if(!window.MediaRecorder)throw new Error('この端末のブラウザは動画変換に未対応です');
  const url=URL.createObjectURL(file);
  const v=document.createElement('video');v.muted=true;v.playsInline=true;v.preload='auto';v.src=url;
  await new Promise((res,rej)=>{v.onloadedmetadata=()=>res();v.onerror=()=>rej(new Error('動画を読み込めませんでした'));});
  const dur=v.duration||0;
  if(dur>75){URL.revokeObjectURL(url);throw new Error('動画は1分以内にしてください（現在 約'+Math.round(dur)+'秒）');}
  const vw=v.videoWidth||640,vh=v.videoHeight||480;const sc=Math.min(1,480/(Math.min(vw,vh)||480));
  const w=Math.max(2,Math.round(vw*sc/2)*2),h=Math.max(2,Math.round(vh*sc/2)*2);
  const cv=document.createElement('canvas');cv.width=w;cv.height=h;const ctx=cv.getContext('2d');
  const stream=cv.captureStream(15);
  let mime='';['video/mp4;codecs=h264','video/mp4','video/webm;codecs=vp8','video/webm'].forEach(m=>{if(!mime&&MediaRecorder.isTypeSupported(m))mime=m;});
  const rec=new MediaRecorder(stream,Object.assign({videoBitsPerSecond:900000},mime?{mimeType:mime}:{}));
  const chunks=[];rec.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data);};
  const stopped=new Promise(res=>{rec.onstop=res;});
  rec.start(1000);
  let raf=0;const draw=()=>{try{ctx.drawImage(v,0,0,w,h);}catch(e){}if(onProgress&&dur)onProgress(Math.min(1,v.currentTime/dur));raf=requestAnimationFrame(draw);};
  await v.play().catch(()=>{});draw();
  await new Promise(res=>{let f=false;const fin=()=>{if(!f){f=true;res();}};v.onended=fin;setTimeout(fin,(dur+5)*1000);});
  cancelAnimationFrame(raf);try{rec.stop();}catch(e){}await stopped;try{v.pause();}catch(e){}
  URL.revokeObjectURL(url);
  const outMime=(rec.mimeType||mime||'video/webm').split(';')[0];
  const ext=outMime.indexOf('mp4')>=0?'mp4':'webm';
  const blob=new Blob(chunks,{type:outMime});
  if(!blob.size)throw new Error('動画の圧縮に失敗しました（ブラウザ未対応の可能性）');
  return {blob,ext,type:outMime};
}
function opName(){return localStorage.getItem('survey_op')||'';}
function setOp(v){localStorage.setItem('survey_op',v);}

async function main(){
  const shareB=new URLSearchParams(location.search).get('b');
  if(shareB){ return openBuilding(shareB,'','',false,true); } // 共有リンク＝閲覧専用
  try{
    const {data,error}=await sb.from('cl_survey_photos').select('building,address,vendor,visit_date,created_at');
    if(error)throw error;
    renderList(data||[]);
  }catch(e){root.innerHTML='';root.appendChild($('div','load','エラー: '+e.message));}
}

function renderList(rows){
  const map={};
  rows.forEach(r=>{const k=r.building;if(!k)return;const m=map[k]||(map[k]={building:k,address:r.address||'',vendor:r.vendor||'',count:0,last:''});m.count++;if(r.address)m.address=r.address;if(r.vendor)m.vendor=r.vendor;const d=String(r.visit_date||r.created_at||'').slice(0,10);if(d>m.last)m.last=d;});
  const blds=Object.values(map).sort((a,b)=>(b.last||'').localeCompare(a.last||''));
  root.innerHTML='';
  const hd=$('div','hd');const t=$('div');t.appendChild(Object.assign($('h1',null,'📷 現調・立会 写真'),{}));t.appendChild($('div','sub','建物ごとに写真をためる'));hd.appendChild(t);root.appendChild(hd);
  const card=$('div','card');
  const search=$('input','search');search.type='search';search.placeholder='🔍 物件名で検索';card.appendChild(search);
  const list=$('div','blist');card.appendChild(list);
  const nb=$('div','newb','＋ 新しい建物');nb.onclick=()=>openBuilding('','','',true);card.appendChild(nb);
  root.appendChild(card);
  function draw(){
    const q=search.value.trim().toLowerCase();list.innerHTML='';
    const ms=blds.filter(b=>!q||b.building.toLowerCase().indexOf(q)>=0||(b.address||'').toLowerCase().indexOf(q)>=0);
    if(!ms.length){list.appendChild($('div','hint',q?'該当なし':'まだ建物がありません。「＋新しい建物」から追加してください。'));return;}
    ms.forEach(b=>{const r=$('div','brow');r.appendChild($('div','nm',b.building));r.appendChild($('div','meta',(b.address?b.address+' ・ ':'')+'写真 '+b.count+'枚'+(b.last?' ・ 最終 '+dtxt(b.last):'')));r.onclick=()=>openBuilding(b.building,b.address,b.vendor,false);list.appendChild(r);});
  }
  search.oninput=draw;draw();
}

async function openBuilding(name,address,vendor,isNew,viewOnly){
  root.innerHTML='';
  if(!viewOnly){const back=$('button','back','‹ 建物一覧へ');back.onclick=main;root.appendChild(back);}
  const card=$('div','card');
  if(isNew){
    card.appendChild($('div','label','業者名（任意）'));
    const ve=$('input','finput');ve.placeholder='業者名';ve.value=localStorage.getItem('survey_vendor')||'';card.appendChild(ve);
    card.appendChild($('div','label','建物名（号室まで）（必須）'));
    const ni=$('input','finput');ni.placeholder='物件名 号室';card.appendChild(ni);
    card.appendChild($('div','label','住所（任意）'));
    const ai=$('input','finput');ai.placeholder='住所';card.appendChild(ai);
    const go=$('button','btn ghost','この建物ではじめる');go.onclick=()=>{const v=ni.value.trim();if(!v){alert('建物名を入れてください');return;}openBuilding(v,ai.value.trim(),ve.value.trim(),false);};card.appendChild(go);
    root.appendChild(card);ni.focus();return;
  }
  card.appendChild($('h1',null,name));
  const subEl=$('div','sub',address||'');card.appendChild(subEl);
  // ▼ ダウンロード＆共有（上部に配置：すぐ見つかるように）
  const dlbtn=$('button','btn ghost','📥 写真をまとめてダウンロード（ZIP）');dlbtn.style.marginTop='8px';card.appendChild(dlbtn);
  dlbtn.onclick=async()=>{
    if(!photos.length){alert('写真がありません');return;}
    const orig=dlbtn.textContent;dlbtn.disabled=true;
    try{
      dlbtn.textContent='⏳ 準備中…';await loadJSZip();
      const zip=new JSZip();let n=0;
      for(const p of photos){try{const r=await fetch(p.url);const b=await r.blob();zip.file(p.filename||('photo_'+(n+1)+'.jpg'),b);n++;dlbtn.textContent='⏳ '+n+' / '+photos.length;}catch(e){}}
      const blob=await zip.generateAsync({type:'blob'});const u=URL.createObjectURL(blob);
      const a=document.createElement('a');a.href=u;a.download=(name+'_現調写真.zip').replace(/[\\/:*?"<>|]/g,'_');document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(u);
      dlbtn.textContent='✓ '+n+'枚 ダウンロード';setTimeout(()=>{dlbtn.textContent=orig;dlbtn.disabled=false;},3000);
    }catch(e){alert('ダウンロード失敗: '+(e.message||e));dlbtn.textContent=orig;dlbtn.disabled=false;}
  };
  if(!viewOnly){
    const share=$('button','btn ghost','🔗 共有リンクをコピー');share.style.marginTop='6px';card.appendChild(share);
    share.onclick=()=>{const link=location.origin+location.pathname+'?b='+encodeURIComponent(name);
      (navigator.clipboard?navigator.clipboard.writeText(link):Promise.reject()).then(()=>alert('共有リンクをコピーしました。\nこのリンクは「この建物の写真だけ」表示されます:\n'+link)).catch(()=>prompt('この共有リンクをコピーしてください',link));};
  }
  let caseNo='',vend,who,vd,upbtn,fi,banner,prog,pf,ptxt;
  if(!viewOnly){
    const linkBox=$('div','sub','');linkBox.style.marginTop='8px';card.appendChild(linkBox);
    // 案件Noの自動照合（物件名+号室が案件と一致すれば紐付け）
    (async()=>{try{const {data}=await sb.from('cl_cases').select('case_no,prop,room');const nb=String(name).replace(/[\s　]/g,'').toLowerCase();(data||[]).forEach(c=>{const k=String((c.prop||'')+(c.room||'')).replace(/[\s　]/g,'').toLowerCase();if(k.length>=4&&(nb.indexOf(k)>=0||k.indexOf(nb)>=0)){caseNo=c.case_no;}});if(caseNo)linkBox.textContent='案件No '+caseNo+' に紐付け';else linkBox.textContent='（一致する案件No なし）';}catch(e){}})();
    card.appendChild($('div','label','業者名（ファイル名・送付先用）'));
    vend=$('input','finput');vend.placeholder='業者名';vend.value=vendor||localStorage.getItem('survey_vendor')||'';vend.onchange=()=>localStorage.setItem('survey_vendor',vend.value.trim());card.appendChild(vend);
    card.appendChild($('div','label','撮影者（アップする人の名前）'));
    who=$('input','finput');who.placeholder='お名前';card.appendChild(who);
    card.appendChild($('div','label','現調日'));
    vd=$('input','finput');vd.type='date';vd.value=todayStr();card.appendChild(vd);
    upbtn=$('button','btn up','📤 写真・動画をアップロード');card.appendChild(upbtn);
    card.appendChild($('div','hint','写真は長辺'+MAX_PX+'px／動画は480p・15fps（1分以内）に自動で軽くして送信'));
    fi=$('input');fi.type='file';fi.accept='image/*,video/*';fi.multiple=true;fi.style.display='none';card.appendChild(fi);
    banner=$('div');banner.style.cssText='display:none;margin-top:10px;border-radius:10px;padding:12px;font-weight:800;text-align:center;font-size:15px';card.appendChild(banner);
    prog=$('div','prog');const pbar=$('div','pbar');pf=$('span');pbar.appendChild(pf);ptxt=$('div','ptxt','');prog.appendChild(pbar);prog.appendChild(ptxt);card.appendChild(prog);
  }
  root.appendChild(card);
  const gc=$('div','gcount','');root.appendChild(gc);
  const gwrap=$('div');root.appendChild(gwrap);

  let photos=[];
  async function load(){
    const {data}=await sb.from('cl_survey_photos').select('*').eq('building',name).order('visit_date',{ascending:false}).order('created_at',{ascending:false});
    photos=data||[];
    if(!address&&photos[0]&&photos[0].address){address=photos[0].address;subEl.textContent=address;}
    drawGallery();
  }
  function drawGallery(){
    gc.textContent='アップ済み '+photos.length+'枚';gwrap.innerHTML='';
    const grp={};photos.forEach(p=>{const d=String(p.visit_date||'').slice(0,10);(grp[d]||(grp[d]=[])).push(p);});
    Object.keys(grp).sort((a,b)=>b.localeCompare(a)).forEach(d=>{
      gwrap.appendChild($('div','grp',dtxt(d)+' 現調（'+grp[d].length+'枚）'));
      const g=$('div','grid');grp[d].forEach(p=>{
        const isV=isVideoName(p.filename)||isVideoName(p.path)||/\.(mp4|webm|mov|m4v)(\?|$)/i.test(p.url);
        if(isV){const cell=$('div');cell.style.cssText='aspect-ratio:1;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#000';const vv=document.createElement('video');vv.src=p.url;vv.controls=true;vv.playsInline=true;vv.preload='metadata';vv.style.cssText='width:100%;height:100%;object-fit:cover;display:block';cell.appendChild(vv);g.appendChild(cell);}
        else{const a=$('a');a.href=p.url;a.target='_blank';a.rel='noopener';const im=$('img');im.src=p.url;im.loading='lazy';a.appendChild(im);g.appendChild(a);}
      });gwrap.appendChild(g);
    });
  }
  async function shrink(f){
    const rawExt=(f.name.split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,'')||'jpg';
    if(!/^image\//.test(f.type||''))return{blob:f,ext:rawExt,type:f.type||'application/octet-stream'};
    try{const bmp=await createImageBitmap(f);const s=Math.min(1,MAX_PX/Math.max(bmp.width,bmp.height));const w=Math.max(1,Math.round(bmp.width*s)),h=Math.max(1,Math.round(bmp.height*s));const cv=document.createElement('canvas');cv.width=w;cv.height=h;cv.getContext('2d').drawImage(bmp,0,0,w,h);const blob=await new Promise(r=>cv.toBlob(r,'image/jpeg',QUALITY));if(bmp.close)bmp.close();if(blob&&blob.size>0)return{blob,ext:'jpg',type:'image/jpeg'};}catch(e){}
    return{blob:f,ext:rawExt,type:f.type||'image/jpeg'};
  }
  async function uploadOne(f,seq,onMsg){
    let blob,ext,type;
    if(isVideoFile(f)){ if(onMsg)onMsg('動画を圧縮中…'); const r=await compressVideo(f,p=>{if(onMsg)onMsg('動画を圧縮中… '+Math.round(p*100)+'%');}); blob=r.blob;ext=r.ext;type=r.type; }
    else { const r=await shrink(f); blob=r.blob;ext=r.ext;type=r.type; }
    const vdv=vd.value||todayStr();
    const ven=vend.value.trim();
    // 表示用の読めるファイル名（日本語OK・Drive/送付用。DBに保存）
    const displayName=[ven,name,vdv].filter(Boolean).map(slug).join('_')+'_'+String(seq).padStart(2,'0')+'.'+ext;
    // ストレージのキーは必ずASCII（Supabaseは日本語キー不可）。建物はハッシュ化。
    const stamp=new Date().toISOString().replace(/[-:T.]/g,'').slice(0,17);
    const path='survey/b'+hhex(name)+'/'+vdv.replace(/-/g,'')+'_'+stamp+'_'+Math.floor(Math.random()*1e9)+'.'+ext;
    const {error:ue}=await sb.storage.from(BUCKET).upload(path,blob,{contentType:type,upsert:false});
    if(ue)throw ue;
    const {data:pub}=sb.storage.from(BUCKET).getPublicUrl(path);
    const rec={building:name,address:address||null,vendor:ven||null,case_no:caseNo||null,visit_date:vdv,url:pub.publicUrl,path:path,filename:displayName,author:who.value.trim()||null};
    const {data:row,error:ie}=await sb.from('cl_survey_photos').insert(rec).select();
    if(ie)throw ie;
    return row[0];
  }
  async function run(files){
    if(!files.length)return;if(!who.value.trim()){if(!confirm('撮影者名が空です。このままアップしますか？'))return;}if(vend.value.trim())localStorage.setItem('survey_vendor',vend.value.trim());
    upbtn.disabled=true;prog.classList.add('on');banner.style.display='none';
    const vdv=vd.value||todayStr();
    const base=photos.filter(p=>String(p.visit_date||'').slice(0,10)===vdv).length; // 同日既存の続き番号
    const hasVid=files.some(isVideoFile);const conc=hasVid?1:UP_CONC; // 動画は同時再エンコード不可のため順次
    const total=files.length;let done=0,ok=0,fail=0,idx=0;
    const upd=(msg)=>{pf.style.width=Math.round(done/total*100)+'%';ptxt.textContent=(msg||'送信中…')+' '+done+' / '+total+' 件'+(fail?'（失敗 '+fail+'）':'');};
    upd();
    async function worker(){while(idx<files.length){const my=idx++;try{const r=await uploadOne(files[my],base+my+1,(m)=>{ptxt.textContent=m+'（'+(done+1)+'/'+total+'）';});photos.unshift(r);ok++;drawGallery();}catch(e){fail++;console.error(e);}done++;upd();}}
    await Promise.all(Array.from({length:Math.min(conc,files.length)},worker));
    upbtn.disabled=false;prog.classList.remove('on');
    // 送信結果をはっきり表示（自動で消さない）
    if(fail===0){banner.style.background='#123d2e';banner.style.color='#2bd4b6';banner.textContent='✅ 送信完了：'+ok+'枚（'+name+'）';}
    else{banner.style.background='#3d1a17';banner.style.color='#ff8a7a';banner.textContent='⚠️ '+ok+'枚 送信 / '+fail+'枚 失敗。失敗分はもう一度アップしてください';}
    banner.style.display='block';
    // アップ成功したら即Drive同期を起動（fire-and-forget）
    if(ok>0&&SYNC_URL){try{fetch(SYNC_URL+'?token='+encodeURIComponent(SYNC_TOKEN)+'&t='+Date.now(),{mode:'no-cors',cache:'no-store'});}catch(e){}}
  }
  if(!viewOnly){
    upbtn.onclick=()=>fi.click();
    fi.onchange=()=>{const files=[...fi.files];fi.value='';run(files);};
  }
  load();
}
